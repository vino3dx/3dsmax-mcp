[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "3dsmax-mcp"
version = "1.2.0"
description = "MCP plugin that lets AI agents drive Autodesk 3ds Max (2020 and later) for modelling, materials, rigging, animation, rendering, baking and engine export."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "3dsmax-mcp contributors" }]
keywords = ["mcp", "3dsmax", "autodesk", "maxscript", "ai", "agent", "dcc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
# No runtime dependencies: the server is stdlib only, which keeps the installer
# self contained and avoids touching the user's Python environment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
3dsmax-mcp = "maxmcp.server:main"

[project.urls]
Homepage = "https://github.com/vino3dx/3dsmax-ai-mcp"
Changelog = "https://github.com/vino3dx/3dsmax-ai-mcp/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src/python" }

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["UP006", "UP007", "UP035"]
